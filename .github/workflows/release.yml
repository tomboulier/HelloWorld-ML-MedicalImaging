# Release: compute the next version from the Conventional Commits since the
# last tag, update pyproject.toml and CHANGELOG.md, commit, tag and create a
# GitHub release. Started by hand from the Actions tab, on the main branch.
# Nothing is published to PyPI (see docs/automation.md).
name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - uses: python-semantic-release/python-semantic-release@v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build: false
