# Documentation: build the MkDocs site on every push and pull request, and
# publish it to GitHub Pages when the main branch changes.
# Publishing requires Pages to be enabled once in the repository settings
# (Settings > Pages > Build and deployment > Source: "GitHub Actions").
name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install the documentation tools
        run: uv sync --frozen --only-group docs
      - name: Build the site
        run: uv run --no-sync mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
